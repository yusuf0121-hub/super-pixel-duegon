subprojects {
    apply plugin: 'java'

    group = 'com.superpixel'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

project(':server') {
    apply plugin: 'application'

    jar {
        manifest {
            attributes 'Main-Class': 'com.superpixel.server.ServerMain'
        }
        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
        archiveFileName = 'super-pixel-duegon-server.jar'
    }
}

project(':client') {
    apply plugin: 'application'

    jar {
        manifest {
            attributes 'Main-Class': 'com.superpixel.client.ClientMain'
        }
        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
        archiveFileName = 'super-pixel-duegon-client.jar'
    }
}

task buildAll {
    dependsOn ':server:jar', ':client:jar'
}
